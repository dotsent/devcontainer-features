name: Release Features

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Prepare bundled Feature assets
        run: scripts/prepare-feature-assets.sh

      - name: Test bundled Feature installers
        run: scripts/test-feature-installers.sh

      - name: Publish Features
        uses: devcontainers/action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          publish-features: "true"
          base-path-to-features: "./src"
          oci-registry: "ghcr.io"
          features-namespace: "${{ github.repository_owner }}/devcontainer-features"
          generate-docs: "true"

      - name: Create PR for generated documentation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git config pull.rebase false
          branch=automated-documentation-update-$GITHUB_RUN_ID
          git checkout -b $branch
          git add src/**/README.md
          git commit -m "docs: auto-update feature documentation [skip ci]" || exit 0
          git push origin "$branch"
          gh pr create \
            --title "docs: auto-update feature documentation" \
            --body "Automatically generated by the release workflow."
