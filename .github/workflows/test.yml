name: Test Features

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "test/**"
  pull_request:
    paths:
      - "src/**"
      - "test/**"
  workflow_dispatch:

jobs:
  test-autogenerated:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        feature:
          - websocat
        base-image:
          - debian:bookworm
          - ubuntu:22.04
          - mcr.microsoft.com/devcontainers/base:ubuntu
    steps:
      - uses: actions/checkout@v4

      - name: Install @devcontainers/cli
        run: npm install -g @devcontainers/cli

      - name: "Test autogenerated: ${{ matrix.feature }} on ${{ matrix.base-image }}"
        run: |
          devcontainer features test \
            --skip-scenarios \
            -f ${{ matrix.feature }} \
            -i ${{ matrix.base-image }} \
            .

  test-scenarios:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        feature:
          - websocat
    steps:
      - uses: actions/checkout@v4

      - name: Install @devcontainers/cli
        run: npm install -g @devcontainers/cli

      - name: "Test scenarios: ${{ matrix.feature }}"
        run: |
          devcontainer features test \
            --skip-autogenerated \
            -f ${{ matrix.feature }} \
            .
